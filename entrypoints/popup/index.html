<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dul Subtitle</title>
  </head>
  <body>
    <main>
      <header><span class="eyebrow">DUL SUBTITLE</span><span class="badge">开发预览</span></header>
      <h1>让两种语言，同时出现。</h1>
      <p class="intro">从当前影片的字幕中选择两种语言，按你的习惯排列。</p>
      <section class="connection" aria-labelledby="connection-heading">
        <h2 id="connection-heading">播放器状态</h2>
        <p id="status" role="status">正在检测当前页面…</p>
        <button id="refresh" type="button">重新检测</button>
      </section>
      <div class="language-grid">
        <label>上方字幕<select id="upper-language" disabled aria-describedby="pending"><option>等待读取影片语言</option></select></label>
        <label>下方字幕<select id="lower-language" disabled aria-describedby="pending"><option>等待读取影片语言</option></select></label>
      </div>
      <p id="pending" class="hint">正在检测字幕列表，实验版需要两条可下载的文本轨道。</p>
      <section aria-labelledby="preview-heading">
        <h2 id="preview-heading">样式预览 <span class="hint">示例文字</span></h2>
        <div class="preview"><p id="upper-preview">Your first subtitle language.</p><p id="lower-preview">这里显示你选择的第二种语言。</p></div>
        <label class="slider-label" for="font-size">字幕字号 <output id="font-size-value" for="font-size">24 px</output></label>
        <input id="font-size" type="range" min="16" max="36" step="1" value="24" disabled />
        <label class="slider-label" for="background-opacity">字幕背景 <output id="background-value" for="background-opacity">透明</output></label>
        <input id="background-opacity" type="range" min="0" max="100" step="5" value="0" disabled />
        <label class="slider-label" for="text-shadow">文字阴影 <input id="text-shadow" type="checkbox" checked disabled /></label>
        <button id="reset-style" type="button" disabled>恢复默认样式</button>
        <p id="settings-status" class="hint" role="status">正在读取本机设置…</p>
      </section>
      <button id="start-dual" class="primary" disabled>开启双语字幕（实验版）</button>
      <button id="stop-dual" class="primary" type="button">关闭并恢复原生字幕</button>
      <p id="dual-status" class="hint" role="status">双语字幕未开启。</p>
      <details class="troubleshooting">
        <summary>连接与字幕排查</summary>
        <pre id="diagnostics" class="hint" aria-live="polite"></pre>
        <button id="inspect-resources" type="button" disabled>检查所选字幕资源</button>
        <pre id="resource-result" class="hint" role="status"></pre>
      </details>
      <footer>语言由当前影片决定 · 设置仅保存在本机</footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
