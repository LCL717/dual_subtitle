<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dual Subtitle · 本机字体</title></head>
<body><main>
  <h1>读取本机字体</h1>
  <p>点击后，浏览器可能请求字体访问权限。仅将字体名称保存在本机，不上传或读取字体文件内容。</p>
  <button id="scan" type="button">读取 / 更新本机字体</button>
  <button id="clear" type="button">清除已保存的字体列表</button>
  <p id="status" role="status">未读取时仍可使用系统默认、衬线和等宽字体。</p>
  <p>读取完成后，回到 Netflix，从扩展弹窗的“字体”下拉框选择。缺失的语言字符由备用字体显示。</p>
  <p>清除列表不会撤销浏览器权限，也不会更改已经选中的字体。</p>
  <ul id="fonts"></ul>
</main><script type="module" src="./main.ts"></script></body>
</html>
